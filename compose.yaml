services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recall}
      POSTGRES_DB: recall
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - recall_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall -d recall"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgres://recall:${POSTGRES_PASSWORD:-recall}@db:5432/recall
      HOST: 0.0.0.0
      PORT: 4310
    ports:
      - "127.0.0.1:4310:4310"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  recall_pg:
