name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: ./mobile/android/gradlew -p mobile/android testDebugUnitTest assembleRelease --console=plain
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ./desktop/windows/build.ps1
      - run: npm run test:installer
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: recall
          POSTGRES_PASSWORD: recall
          POSTGRES_DB: recall
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U recall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://recall:recall@127.0.0.1:5432/recall
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build and start Docker stack
        run: docker compose up -d --build --wait
      - name: Verify packaged app and CLI
        run: |
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:4310/api/health
          curl --fail --silent http://127.0.0.1:4310/ > /dev/null
          docker compose exec -T app npm run seed
          docker compose exec -T app npm run recall -- stats "Recall Demo" --json
      - name: Stop test stack
        if: always()
        run: docker compose down -v
